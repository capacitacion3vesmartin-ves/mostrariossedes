<style>
:root{--g:#10a43a;--gd:#06621c;--tx:#13302a;--mu:#5b6f66;--bd:#d8e6dc;--bg:#f2f7f3}
*{box-sizing:border-box}
body{margin:0;padding-top:50px;color:var(--tx);font:15px/1.4 system-ui,"Segoe UI",Arial,"Segoe UI Emoji","Segoe UI Symbol","Apple Color Emoji","Noto Color Emoji",sans-serif;background:var(--bg);min-height:100vh}

.sb{display:flex;gap:8px;margin-bottom:12px}.sb input{flex:1;min-width:0;border:2px solid var(--bd);border-radius:12px;padding:10px 12px;background:#fff}.sb input:focus{outline:0;border-color:var(--g)}

.hn.s{bottom:calc(var(--hs)/-2 - 1px);left:calc(50% - var(--hs)/2);cursor:ns-resize}
.hn.w{left:calc(var(--hs)/-2 - 1px);top:calc(50% - var(--hs)/2);cursor:ew-resize}

function guardarF(id){const m=getM(id),ft=String(FT||'').trim();
 if(ft&&!okImg(ft)){msg('La foto general no es un enlace válido (debe empezar con https://).');return}
 const pts=PT.map(p=>({id:p.id,nombre:(p.nombre||'').trim()||'Parte',foto:String(p.foto||'').trim(),filas:+p.filas>=1?+p.filas:2}));
 for(const p of pts)if(p.foto&&!okImg(p.foto)){msg('El enlace de «'+p.nombre+'» no es válido (debe empezar con https://).');return}
 const old=m.partes||[],all=DB.prods.filter(p=>p.mos==id),ids=new Set(pts.map(p=>p.id));let aviso='',lost=0;
 if(!old.length){
  if(pts.length){const mf=Math.max(+m.filas||1,...all.map(p=>(+p.r||0)+(+p.sy||1)));all.forEach(p=>p.parte=pts[0].id);pts[0].filas=Math.max(pts[0].filas,mf)}
  m.partes=pts}
 else{
  const oidx=new Map(all.map(p=>[p.id,old.findIndex(x=>x.id==secOf(m,p))]));
  const orf=all.filter(p=>!ids.has(old[oidx.get(p.id)].id)).sort((a,b)=>oidx.get(a.id)-oidx.get(b.id)||(a.r-b.r)||(a.c-b.c));
  const tgt=pts.length?pts[0].id:'',act=orf.filter(p=>p.estado=='ACTIVO');
  orf.forEach(p=>{if(p.estado!='ACTIVO')p.parte=tgt});
  m.partes=pts;if(!pts.length)m.filas=Math.max(1,+old[0].filas||1);
  act.forEach(p=>{p.estado='MOV'});
  act.forEach(p=>{
   if(!pts.length&&oidx.get(p.id)==0){p.parte='';p.estado='ACTIVO';return}
   let w=p.sx,h=p.sy,hc=hueco(m,w,h,tgt);if(!hc){w=h=1;hc=hueco(m,1,1,tgt)}
   if(!hc){p.estado='OCULTO';lost++;return}
   p.parte=tgt;p.r=hc.r;p.c=hc.c;p.sx=w;p.sy=h;p.estado='ACTIVO'});
  if(orf.length)aviso='Los productos de las partes quitadas pasaron a '+(pts.length?'«'+pts[0].nombre+'»':'el mostrario')+'.'+(lost?' '+lost+' no cupieron y pasaron a la papelera.':'')}
 m.foto=ft;m.fotos=[];UNDO=[];
 if(pts.length&&!pts.some(x=>OPEN.has(x.id)))OPEN=new Set([pts[0].id]);
 save();cerrar();R();if(aviso)toast(aviso)}
const defSec=()=>{const P=(getM(MOS).partes)||[],o=P.find(x=>OPEN.has(x.id));return o?o.id:(P[0]?P[0].id:'')};
/* --- mover: a un espacio vacío, intercambiar con otro casillero, o pasarlo a otra parte --- */
function mover(a,tg){const m=getM(MOS),A=getP(a),sA=secOf(m,A),oA=rc(A);
 if(tg.head!=null){const sT=tg.head;if(sT==sA)return;snap();
  let w=oA.w,h=oA.h,hc=hueco(m,w,h,sT);if(!hc&&(w>1||h>1)){w=h=1;hc=hueco(m,1,1,sT)}
  if(!hc){UNDO.pop();toast('Esa parte está llena.');return}
  FLASH=a;FLASH2=null;FLASH2R={...oA,s:sA};A.parte=sT;A.r=hc.r;A.c=hc.c;A.sx=w;A.sy=h;OPEN.add(sT);save();R();
  toast('Movido a «'+parteNom(m,sT)+'»'+(w!=oA.w||h!=oA.h?' (pasó a tamaño 1×1)':''));
  const el=document.querySelector('.tl[data-id="'+a+'"]');if(el)el.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});limpiar();return}
 let B=null,r,c,sT;
 if(tg.id){B=getP(tg.id);r=B.r;c=B.c;sT=secOf(m,B)}else{r=tg.r;c=tg.c;sT=tg.s||''}
 if(sT==sA&&r==A.r&&c==A.c)return;
 const nA={r,c,w:oA.w,h:oA.h};let swap=false;
 if(!libre(m,[a],nA,sT)){
  if(!B){toast('No cabe ahí: este casillero ocupa '+oA.w+'×'+oA.h+'.');return}
  const oB=rc(B),nA2={r:oB.r,c:oB.c,w:oA.w,h:oA.h},nB={r:oA.r,c:oA.c,w:oB.w,h:oB.h};
  if(libre(m,[a,B.id],nA2,sT)&&libre(m,[a,B.id],nB,sA)&&!(sT==sA&&solapa(nA2,nB)))swap=true;
  else{toast('No se pueden intercambiar: los tamaños no caben.');return}}
 snap();FLASH=a;FLASH2=null;FLASH2R=null;
 if(swap){const oB=rc(B);A.r=oB.r;A.c=oB.c;A.parte=sT;B.r=oA.r;B.c=oA.c;B.parte=sA;FLASH2=B.id}
 else{A.r=r;A.c=c;A.parte=sT;FLASH2R={...oA,s:sA}}
 if(sT!=sA)OPEN.add(sT);
 save();R();const el=document.querySelector('.tl[data-id="'+a+'"]');if(el)el.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});limpiar();
 if(sT!=sA)toast('Movido a «'+parteNom(m,sT)+'»')}
